name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://nnovara.io
      PAYMENT_PROVIDER: ""
      ENABLE_BANK_TRANSFER: "true"
      TAX_RATE: "0"
      AUTH_SECRET: ci-only-placeholder-auth-secret-32-bytes
      ORDER_ACCESS_SECRET: ci-only-placeholder-order-secret-32-bytes
      DATABASE_URL: postgresql://ci:ci@localhost:5432/novara
      DIRECT_URL: postgresql://ci:ci@localhost:5432/novara
      MAIL_FROM: hello@nnovara.io
      CONTACT_TO_EMAIL: hello@nnovara.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev
